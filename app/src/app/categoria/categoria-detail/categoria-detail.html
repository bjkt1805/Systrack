<!-- Revisar si hay datos antes de mostrar el detalle del técnico -->

@if (datos()) {
<br>
<mat-card class="tech-card" appearance="outlined" style="margin-top: 10px;">

    <!-- Encabezado del card con avatar (OPCIONAL) -->
    <mat-card-header class="tech-card__header">

        <!-- Título y subtítulo del card -->
        <div class="tech-card__title">
            <mat-card-title class="tech-card__name">
                {{ datos()?.nombre }}
            </mat-card-title>
        </div>
    </mat-card-header>
    <mat-divider></mat-divider>

    <mat-card-content class="tech-card__content">
        <!-- Panel de información -->
        <section class="tech-info">

            <!-- Contenedor del nombre-->
            <div class="info-row">
                <span class="info-label">Nombre</span>
                <span class="info-value">{{ datos()?.nombre }}</span>
            </div>

            <!-- Contenedor del descripción -->
            <div class="info-row" *ngIf="datos()?.descripcion">
                <span class="info-label">Descripción</span>
                <span class="info-value">{{ datos()?.descripcion }}</span>
            </div>

            <!-- Contenedor del etiquetas -->
            <div class="info-row" *ngIf="datos()?.etiquetas">
                <span class="info-label">Etiquetas</span>
                <span class="info-value">{{ datos()?.etiquetas }}</span>
            </div>

            <!-- Contenedor del especialidades -->
            <div class="info-row" *ngIf="datos()?.especialidades">
                <span class="info-label">Especialidades</span>
                <span class="info-value">{{ datos()?.especialidades }}</span>
            </div>
        </section>
    </mat-card-content>
    
    <!-- Acciones del card -->
    <mat-card-actions class="tech-card__actions">

        <!-- Botón de regresar (llamando al signal)-->
        <button mat-stroked-button color="primary" class="btn-back" (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
            Regresar
        </button>
    </mat-card-actions>
</mat-card>
}
@else {
<mat-card class="tech-card tech-card--empty" appearance="outlined">
    <mat-card-content class="empty">
        <mat-icon>person_search</mat-icon>
        <p class="mat-body text">Categoría no encontrada</p>
        <button mat-stroked-button color="primary" (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
            Regresar
        </button>
    </mat-card-content>
</mat-card>
}
