<div class="page-not-found-container">
    <mat-grid-list cols="2" gutterSize="24px" rowHeight="1:1" class="grid-container">
        <!-- Imagen 404 -->
        <mat-grid-tile>
            <div class="image-section">
                <img class="img-responsive" src="/images/robot.png" alt="404 robot" />
            </div>
        </mat-grid-tile>
        <!-- Mensaje -->
        <mat-grid-tile>
            <div class="message-section">
                <h1 class="error-code">404</h1>
                <h2 class="error-title">{{ 'PAGE_NOT_FOUND.TITULO' | translate }}</h2>
                <p class="error-text">
                    {{ 'PAGE_NOT_FOUND.MENSAJE' | translate }}
                </p>
                <button mat-stroked-button class="btn-primary" (click)="irInicio()">
                    {{ 'PAGE_NOT_FOUND.BOTON_REGRESAR' | translate }}
                </button>
            </div>
        </mat-grid-tile>
    </mat-grid-list>
</div>
