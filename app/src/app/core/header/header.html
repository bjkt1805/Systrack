<!-- https://material.angular.dev/components/menu/overview -->
<!--https://fonts.google.com/icons-->

<!-- <mat-toolbar class="header primary-gradient"> -->

<!-- Se le quitó el fondo degradado al header-->
<mat-toolbar class="header">
    <!-- Logo -->
    <button mat-icon-button (click)="irInicio()" class="example-header-image" matTooltip="{{ 'HEADER.INICIO' | translate }}"></button>

    <div class="menu-section">

        <button [matMenuTriggerFor]="menu1" mat-icon-button class="example-icon" matTooltip="{{ 'HEADER.LISTADOS' | translate }}" style="font-size: 16px;">
            <!-- <mat-icon>menu</mat-icon> -->
            {{ 'HEADER.LISTADOS' | translate }}
        </button>

        <button mat-icon-button matTooltip="{{ 'HEADER.PROCESOS' | translate }}" [matMenuTriggerFor]="menu3" style="font-size: 16px;">
            <!-- <mat-icon>save_as</mat-icon> -->
            {{ 'HEADER.PROCESOS' | translate }}
        </button>

        <!-- Reportes es solo visible para el usuario con rol Admin PARA CUANDO SIRVA AUTENTICACION-->
        <!-- @if (isAdmin()) {
        <button mat-icon-button matTooltip="Reportes" [matMenuTriggerFor]="menu4" style="font-size: 16px;">
            <mat-icon>monitoring</mat-icon>
            Reportes
        </button>
        } -->
        <button mat-icon-button matTooltip="{{ 'HEADER.REPORTES' | translate }}" [matMenuTriggerFor]="menu4" style="font-size: 16px;">
            <!-- <mat-icon>monitoring</mat-icon> -->
            {{ 'HEADER.REPORTES' | translate }}
        </button>
    </div>


    <!-- Menús desplegables -->

    <!-- Menú desplegable de Listados-->
    <mat-menu #menu1="matMenu">
        <button mat-menu-item [routerLink]="['/tecnico']">{{ 'HEADER.TECNICOS' | translate }}</button>
        <button mat-menu-item [routerLink]="['/categoria']">{{ 'HEADER.CATEGORIAS' | translate }}</button>
        <button mat-menu-item [routerLink]="['/ticket']">{{ 'HEADER.TICKETS' | translate }}</button>
        <button mat-menu-item [routerLink]="['/asignacion']">{{ 'HEADER.ASIGNACIONES' | translate }}</button>

    </mat-menu>

    <!-- Menú desplegable de Mantenimientos-->
    <mat-menu #menu2="matMenu">
        <button mat-menu-item>{{ 'HEADER.PROCESOS' | translate }}</button>
    </mat-menu>

    <!-- Menú desplegable de Procesos-->
    <mat-menu #menu3="matMenu">
        <button mat-menu-item>{{ 'HEADER.TRAZABILIDAD' | translate }}</button>
        <button mat-menu-item>{{ 'HEADER.GESTION' | translate }}</button>
    </mat-menu>

    <!-- Menú desplegable de Reportes-->
    <mat-menu #menu4="matMenu">
        <button mat-menu-item>{{ 'HEADER.REPORTE' | translate }}</button>
    </mat-menu>

    <!-- Spacer
    <div class="example-spacer"></div> -->



    
    <!-- Usuario -->
    <div class="user-section">
        <!-- Botón de idioma -->
        <button mat-icon-button [matMenuTriggerFor]="menuIdioma" matTooltip="{{ 'HEADER.IDIOMA' | translate }}">
            <mat-icon>language</mat-icon>
        </button>
        <mat-menu #menuIdioma="matMenu">
            <button mat-menu-item>
                <mat-icon style="color: white">flag</mat-icon>
                <span>{{ 'HEADER.IDIOMA1' | translate }}</span>
            </button>
            <button mat-menu-item>
                <mat-icon style="color: white">flag</mat-icon>
                <span>{{ 'HEADER.IDIOMA2' | translate }}</span>
            </button>
        </mat-menu>
        <!-- <button mat-icon-button matBadge="3" matBadgeColor="accent" class="small-text">
            <mat-icon>shopping_cart</mat-icon>
        </button> -->
        <!-- <span class="small-text user-email">Email</span> -->
        <button mat-icon-button [matMenuTriggerFor]="menu5" matTooltip="{{ 'HEADER.USUARIO' | translate }}">
            <mat-icon>person</mat-icon>
        </button>
        <mat-menu #menu5="matMenu">
            <button mat-menu-item (click)="irLogin()">
                <mat-icon style="color: white">person_add</mat-icon>
                <span>{{ 'HEADER.LOGIN' | translate }}</span>
            </button>
            <button mat-menu-item (click)="logout()">
                <mat-icon style="color: white">person_remove</mat-icon>
                <span>{{ 'HEADER.LOGOUT' | translate }}</span>
            </button>
        </mat-menu>
    </div>
</mat-toolbar>
