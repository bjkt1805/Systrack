<div class="hero">
  <div class="bg-blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="welcome-card">
    <div class="primary-title">
      <div class="logo-ring">
        <img src="assets/logo.svg" alt="Logo">
      </div>
      <div class="title-content">
        <h2 class="title">Bienvenido, admin</h2>
        <p class="subtitle">Sistema de Gestión de Tickets</p>
      </div>
    </div>

    <div class="menu-grid">
      <a class="menu-item" routerLink="/panel">
        <mat-icon>dashboard</mat-icon>
        <span>Panel</span>
      </a>
      <a class="menu-item primary" routerLink="/tickets">
        <mat-icon>confirmation_number</mat-icon>
        <span>Tickets</span>
      </a>
      <a class="menu-item" routerLink="/usuarios">
        <mat-icon>person</mat-icon>
        <span>Usuarios</span>
      </a>
      <a class="menu-item" routerLink="/articulos">
        <mat-icon>article</mat-icon>
        <span>Artículo</span>
      </a>
      <a class="menu-item" routerLink="/staff">
        <mat-icon>groups</mat-icon>
        <span>Staff</span>
      </a>
      <a class="menu-item" routerLink="/configuracion">
        <mat-icon>settings</mat-icon>
        <span>Configuración</span>
      </a>
    </div>

    <div class="submenu">
      <button mat-button class="submenu-item active">Mis Tickets</button>
      <button mat-button class="submenu-item">Nuevos Tickets</button>
      <button mat-button class="submenu-item">Todos los Tickets</button>
      <button mat-button class="submenu-item">Respuestas Personalizadas</button>
    </div>
  </div>
</div>
