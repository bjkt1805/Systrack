<!-- Componente de tarjeta de bienvenida -->  
<mat-card appearance="outlined">

    <!-- Encabezado de la tarjeta -->
    <mat-card-header class="primary-title" style="text-align: center;">
        <!-- <div mat-card-avatar class="example-header-image"></div> -->
        <mat-card-title >Systrack</mat-card-title>
        <mat-card-subtitle>Tu aliado tecnológico</mat-card-subtitle>
    </mat-card-header>

    <!-- Imagen de la tarjeta -->
    <img mat-card-image src="/images/systrackLogo.png" style="width: 30%; height: 20%; align-self: center; padding-top: 2%" />

    <!-- Contenido de la tarjeta -->
    <mat-card-content class="secondary-title">
        <p class="text">Aplicación Angular para consumo de API NodeJS</p>
    </mat-card-content>
</mat-card>
