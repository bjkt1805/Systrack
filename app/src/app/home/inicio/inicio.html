<div class="hero">
  <div class="bg-blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="welcome-card">
    <div class="primary-title">
      <div class="logo-ring">
        <img src="/images/systrackLogo.png" alt="Logo Systrack" loading="lazy">
      </div>
      <div class="title-content">
        <h1 class="title">Bienvenido(a)</h1>
        <p class="subtitle">Sistema de Gestión de Tickets</p>
      </div>
    </div>

    <nav class="menu-grid" role="navigation" aria-label="Menú principal">
      <a class="menu-item" routerLink="/panel" routerLinkActive="active">
        <mat-icon aria-hidden="true">dashboard</mat-icon>
        <span>Panel</span>
      </a>
      <a class="menu-item primary" routerLink="/tickets" routerLinkActive="active-primary">
        <mat-icon aria-hidden="true">confirmation_number</mat-icon>
        <span>Tickets</span>
      </a>
      <a class="menu-item" routerLink="/usuarios" routerLinkActive="active">
        <mat-icon aria-hidden="true">person</mat-icon>
        <span>Usuarios</span>
      </a>
      <a class="menu-item" routerLink="/articulos" routerLinkActive="active">
        <mat-icon aria-hidden="true">article</mat-icon>
        <span>Artículos</span>
      </a>
      <a class="menu-item" routerLink="/staff" routerLinkActive="active">
        <mat-icon aria-hidden="true">groups</mat-icon>
        <span>Staff</span>
      </a>
      <a class="menu-item" routerLink="/configuracion" routerLinkActive="active">
        <mat-icon aria-hidden="true">settings</mat-icon>
        <span>Configuración</span>
      </a>
    </nav>

    <div class="submenu" role="navigation" aria-label="Filtros de tickets">
      <button mat-button class="submenu-item active" aria-pressed="true">
        <mat-icon>person</mat-icon>
        Mis Tickets
      </button>
      <button mat-button class="submenu-item" aria-pressed="false">
        <mat-icon>fiber_new</mat-icon>
        Nuevos Tickets
      </button>
      <button mat-button class="submenu-item" aria-pressed="false">
        <mat-icon>list_alt</mat-icon>
        Todos los Tickets
      </button>
      <button mat-button class="submenu-item" aria-pressed="false">
        <mat-icon>forum</mat-icon>
        Respuestas Personalizadas
      </button>
    </div>
  </div>
</div>
