<mat-card class="tickets-card mat-elevation-z8">

  <!-- Header del card -->
  <mat-card-header class="tickets-header">
    <mat-card-title class="title">Listado de Tickets</mat-card-title>
    
    <!-- Subtítulo con el botón de agregar ticket -->
    <!-- <mat-card-subtitle>
      <button mat-mini-fab matTooltip="Crear Ticket" class="btn-primary" (click)="crearTicket()">
        <mat-icon>add</mat-icon>
      </button>
    </mat-card-subtitle> -->

  </mat-card-header>

  <!-- Contenido del card con la tabla de tickets -->
  <mat-card-content>

    <!-- Filtro de usuario -->
    <div class="filtro-usuario">
      <mat-form-field appearance="outline">
        <mat-label>Seleccionar Usuario</mat-label>

        <!-- Select para elegir un usuario -->
        <mat-select [value]="usuarioId()" (selectionChange)="onUsuarioChange($event.value)">
          @for (usuario of usuarios(); track usuario.id) {
          <mat-option [value]="usuario.id">
            {{ usuario.nombreCompleto }} ({{ usuario.rol }})
          </mat-option>
          }
        </mat-select>
      </mat-form-field>
    
      <button mat-raised-button color="warn" (click)="limpiarFiltro()" [disabled]="!usuarioId()">
        <mat-icon>clear</mat-icon>
        Limpiar
      </button>
    </div>

    <div class="tabla-container">
      <table mat-table [dataSource]="dataSource" class="tabla" matSort aria-label="Listado de Tickets">

        <!-- Titulo -->
        <ng-container matColumnDef="titulo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
          <td mat-cell *matCellDef="let row" class="col-title">{{ row.titulo }}</td>
        </ng-container>

        <!-- Descripcion -->
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
          <td mat-cell *matCellDef="let row" class="col-desc">{{ row.descripcion }}</td>
        </ng-container>

        <!-- Estado (badge) -->
        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
          <td mat-cell *matCellDef="let row">

            <!-- Uso de ngClass para agregar clases dinámicas a los badges del estado del tiquete -->
            <span class="badge"
                  [ngClass]="{
                    'badge--pending': row.estado === 'PENDIENTE',
                    'badge--assigned': row.estado === 'ASIGNADO',
                    'badge--progress': row.estado === 'EN_PROCESO',
                    'badge--done': row.estado === 'RESUELTO',
                    'badge--closed': row.estado === 'CERRADO'
                  }">
              {{ row.estado }}
            </span>
          </td>
        </ng-container>

        <!-- Prioridad (badge) -->
        <ng-container matColumnDef="prioridad">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Prioridad</th>
          <td mat-cell *matCellDef="let row">
            
            <!-- Uso de ngClass para agregar clases dinámicas a los badges del estado del tiquete -->
            <span class="badge"
                  [ngClass]="{
                    'badge--low': row.prioridad === 'BAJA',
                    'badge--medium': row.prioridad === 'MEDIA',
                    'badge--high': row.prioridad === 'ALTA',
                    'badge--urgent': row.prioridad === 'URGENTE'
                  }">
              {{ row.prioridad }}
            </span>
          </td>
        </ng-container>

        <!-- Acciones -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Opciones</th>
          <td mat-cell *matCellDef="let row" class="acciones-cell">
            <button matMiniFab matTooltip="Ver detalles" aria-label="Detalle Ticket" (click)="detalleTicket(row.id)">
              <mat-icon class="mat-18">info</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Fila de encabezado -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="tabla-header"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="tabla-row"></tr>
      </table>
    </div>

    <!-- Paginador de la tabla (utiliza (page) para la paginación)-->
    <mat-paginator #paginator
      [length]="paginator.length"
      [pageIndex]="0"
      [pageSize]="5"
      [pageSizeOptions]="[3,5,10]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  
  </mat-card-content>
</mat-card>
